<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Webcall</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Form -->
    <div id="login-form" class="login-container">
        <h1>Login</h1>
        <form id="login-form-element">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <div id="error-message" class="error-message" style="display: none;"></div>
            <button type="submit" id="login-button">Login</button>
        </form>
    </div>

    <!-- Password Change Form -->
    <div id="password-change-form" class="login-container" style="display: none;">
        <h1>Change Password</h1>
        <p class="info-message">Your password has expired. Please set a new password.</p>
        <form id="password-change-form-element">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" name="new-password" required autocomplete="new-password">
                <small class="password-requirements">
                    Must be at least 8 characters with uppercase, lowercase, number, and special character.
                </small>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
            </div>
            <div id="password-change-error" class="error-message" style="display: none;"></div>
            <button type="submit" id="change-password-button">Change Password</button>
        </form>
    </div>

    <!-- Authenticated Content -->
    <div id="authenticated-content" class="authenticated-container" style="display: none;">
        <header class="header">
            <h1>Connect Webcall</h1>
            <div class="user-info">
                <span>Logged in as: <strong id="username-display"></strong></span>
                <button id="logout-button" class="logout-button">Logout</button>
            </div>
        </header>
        <main class="main-content">
            <p>The Connect widget will appear in the bottom-right corner once authenticated.</p>
        </main>
    </div>

    <!-- Scripts -->
    <!-- Vendored locally (served from this app's CloudFront) instead of a third-party CDN. Pinned to amazon-cognito-identity-js@6.3.12. -->
    <script src="amazon-cognito-identity.min.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
